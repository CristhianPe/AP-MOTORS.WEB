<!DOCTYPE html>
<html lang="es-419">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — AP Motors</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
  <link rel="icon" type="image/png" href="assets/img/logo-apmotors.png">
  <meta name="theme-color" content="#0a1547">
</head>
<body class="login-page">
  <main class="login">
    <div class="login__card">
      <div class="login__brand">
        <img src="assets/img/logo-apmotors.png" alt="Logo AP Motors" class="login__logo">
        <h1>AP MOTORS</h1>
        <p>Panel de administración</p>
      </div>

      <form class="login__form" id="loginForm" novalidate>
        <label class="login__field">
          <span>Correo electrónico</span>
          <input type="email" id="loginEmail" placeholder="admin@apmotors.org" autocomplete="username" required>
        </label>
        <label class="login__field">
          <span>Contraseña</span>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
        </label>
        <p class="login__error" id="loginError" hidden></p>
        <p class="login__success" id="loginSuccess" hidden></p>
        <button type="submit" class="login__btn" id="loginBtn">Iniciar sesión</button>
        <button type="button" class="login__btn-google" id="loginGoogleBtn">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Continuar con Google
        </button>
        <div class="login__links">
          <button type="button" class="login__link" id="resetPassBtn">¿Olvidaste tu contraseña?</button>
        </div>
      </form>

      <p class="login__foot">Acceso restringido al personal autorizado.</p>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase.js?v=3"></script>
  <script src="js/login.js?v=3"></script>
</body>
</html>
